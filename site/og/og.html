<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #fafaf9; color: #1c1917;
    font-family: ui-sans-serif, system-ui, "Noto Sans", sans-serif;
    padding: 88px 96px; display: flex; flex-direction: column; justify-content: space-between;
    background-image: radial-gradient(circle at 100% 0%, #e0e7ff 0, transparent 45%);
  }
  .llama { font-size: 120px; line-height: 1; position: absolute; right: 96px; top: 80px; }
  h1 { font-size: 88px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 700; max-width: 820px; }
  p { font-size: 38px; line-height: 1.35; color: #57534e; margin-top: 28px; max-width: 860px; }
  .foot { display: flex; align-items: center; gap: 20px; font-size: 28px; color: #78716c; }
  code {
    font: 600 28px/1 ui-monospace, "DejaVu Sans Mono", monospace; color: #4f46e5;
    background: #eef2ff; border: 2px solid #c7d2fe; border-radius: 12px; padding: 14px 20px;
  }
</style>
</head>
<body>
  <div class="llama">🦙</div>
  <div>
    <h1>Ollama Mock</h1>
    <p>A fake Ollama server for testing. Any model, no GPU, and it runs in your browser.</p>
  </div>
  <div class="foot">
    <code>ollama pull qwen3:8b</code>
    <span>ollama-mock.kinduff.com</span>
  </div>
</body>
</html>
